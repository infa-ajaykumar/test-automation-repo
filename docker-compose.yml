version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq/
    networks:
      - realestate_aggregator_network
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password

  postgres_db:
    image: postgis/postgis:16-3.4
    container_name: postgres_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
      POSTGRES_DB: realestate_listings
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_setup/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - realestate_aggregator_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d realestate_listings"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.3
    container_name: elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - realestate_aggregator_network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -vq '\"status\":\"red\"'"]
      interval: 10s
      timeout: 10s
      retries: 5

  redis_cache:
    image: redis:7.2-alpine
    container_name: redis_cache
    ports:
      - "6379:6379"
    networks:
      - realestate_aggregator_network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

  craigslist_scraper:
    build:
      context: ./scrapers/python_scrapy
      dockerfile: Dockerfile
    container_name: craigslist_scraper
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - realestate_aggregator_network
    environment:
      - HTTP_PROXIES_LIST= # e.g., http://proxy1:port,http://user:pass@proxy2:port

  facebook_scraper:
    build:
      context: ./scrapers/nodejs_puppeteer
      dockerfile: Dockerfile
    container_name: facebook_scraper
    depends_on:
      rabbitmq:
        condition: service_started
    networks:
      - realestate_aggregator_network
    environment:
      - PUPPETEER_PROXY_SERVER= # e.g., http://your_single_proxy_for_facebook:port

  data_processing_service:
    build:
      context: ./data_processing
      dockerfile: Dockerfile
    container_name: data_processing_service
    depends_on:
      rabbitmq:
        condition: service_started
      postgres_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      - realestate_aggregator_network
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=user
      - RABBITMQ_PASS=password
      - GEOPY_USER_AGENT=RealEstateAggregatorBot/1.0 (your.email@example.com) # USER SHOULD UPDATE THIS
      - POSTGRES_HOST=postgres_db
      - POSTGRES_DB=realestate_listings
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=dbpassword
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX_NAME=property_listings

  backend_api_service:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend_api_service
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      redis_cache:
        condition: service_healthy
    networks:
      - realestate_aggregator_network
    environment:
      - DATABASE_URL=postgresql://dbuser:dbpassword@postgres_db:5432/realestate_listings
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
      - ELASTICSEARCH_INDEX_NAME=property_listings
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379

  frontend_service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend_service
    ports:
      - "3000:80"
    networks:
      - realestate_aggregator_network
    depends_on:
      - backend_api_service

  scheduler:
    build:
      context: ./scheduler
      dockerfile: Dockerfile.scheduler
    container_name: scheduler
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/app
    working_dir: /app
    networks:
      - realestate_aggregator_network

networks:
  realestate_aggregator_network:
    driver: bridge

volumes:
  rabbitmq_data:
  postgres_data:
  elasticsearch_data:
  redis_data:
