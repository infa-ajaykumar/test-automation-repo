server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: If REACT_APP_API_BASE_URL is set to a path like /api,
    # you might proxy it from Nginx to the backend container.
    # This example assumes backend is reachable at 'backend_service_name:backend_port'
    # location /api/ {
    #     proxy_pass http://backend_service_name:backend_port/api/; # Ensure backend API base matches
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Handle 404s by redirecting to index.html for client-side routing
    error_page 404 /index.html;

    # Optional: Add security headers
    # add_header X-Frame-Options "SAMEORIGIN";
    # add_header X-Content-Type-Options "nosniff";
    # add_header X-XSS-Protection "1; mode=block";
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
